{{- if not .Values.existingSecret }}
{{- $name := include "qivo.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $pgPassword := include "qivo.kept" (list .Values.postgres.password $existing "POSTGRES_PASSWORD" (randAlphaNum 24)) }}
{{- $masterKey := include "qivo.kept" (list .Values.masterKey $existing "LINEAGE_MASTER_KEY" (randBytes 32 | replace "+" "-" | replace "/" "_")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "qivo.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  PG_DSN: {{ .Values.store.dsn | default (printf "postgresql://qivo:%s@%s-postgres:5432/qivo" $pgPassword (include "qivo.fullname" .)) | quote }}
  LINEAGE_MASTER_KEY: {{ $masterKey | quote }}
  QIVO_ADMIN_EMAIL: {{ .Values.admin.email | quote }}
  QIVO_ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
  LINEAGE_PLATFORM_ADMINS: {{ .Values.admin.email | quote }}
  QIVO_ORGANISATION: {{ .Values.organisation | quote }}
  QIVO_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  ORACLE_DSN: {{ .Values.oracle.dsn | quote }}
  ORACLE_LINEAGE_USER: {{ .Values.oracle.user | quote }}
  ORACLE_LINEAGE_PASSWORD: {{ .Values.oracle.password | quote }}
  QIVO_SANDBOX: {{ .Values.sandbox.wanted | quote }}
  SANDBOX_POOL: {{ .Values.sandbox.pool | quote }}
  SANDBOX_DSN: {{ .Values.sandbox.dsn | quote }}
  SANDBOX_LOADER_USER: {{ .Values.sandbox.loaderUser | quote }}
  SANDBOX_LOADER_PASSWORD: {{ .Values.sandbox.loaderPassword | quote }}
  SANDBOX_CDB_DSN: {{ .Values.sandbox.cdbDsn | quote }}
  SANDBOX_POOL_USER: {{ .Values.sandbox.poolUser | quote }}
  SANDBOX_POOL_PASSWORD: {{ .Values.sandbox.poolPassword | quote }}
  SANDBOX_DATAFILES: {{ .Values.sandbox.datafiles | quote }}
  QIVO_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  QIVO_OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  QIVO_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  QIVO_OIDC_NAME: {{ .Values.oidc.name | quote }}
  QIVO_OIDC_DOMAINS: {{ .Values.oidc.domains | quote }}
  QIVO_OIDC_AUTO_CREATE: {{ .Values.oidc.autoCreate | quote }}
  QIVO_OIDC_ADMIN_GROUP: {{ .Values.oidc.adminGroup | quote }}
  QIVO_METRICS_TOKEN: {{ .Values.metrics.token | quote }}
{{- end }}
